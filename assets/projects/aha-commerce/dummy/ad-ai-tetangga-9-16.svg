<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 800" width="450" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e1e28"/>
      <stop offset="50%" stop-color="#121218"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <pattern id="pat" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#pat)"/>
  
  <!-- Ambient Glows -->
  <circle cx="225" cy="300" r="180" fill="#F42902" opacity="0.16" filter="blur(40px)"/>
  <circle cx="100" cy="650" r="140" fill="#83FD80" opacity="0.05" filter="blur(35px)"/>
  
  <!-- Frame Border -->
  <rect x="20" y="20" width="410" height="760" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" rx="12"/>
  <line x1="20" y1="65" x2="430" y2="65" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="20" y1="735" x2="430" y2="735" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <!-- Meta Top -->
  <text x="38" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#83FD80" letter-spacing="1.5">AHA COMMERCE</text>
  <text x="412" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#A1A1AA" text-anchor="end">AI VIDEO</text>
  
  <!-- Decorative Technical Crosshairs -->
  <circle cx="225" cy="360" r="70" fill="none" stroke="rgba(244,41,2,0.25)" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="225" cy="360" r="45" fill="rgba(244,41,2,0.08)"/>
  
  <!-- Center Play / AI Graphic Symbol -->
  <polygon points="218,345 238,360 218,375" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Title Typography -->
  <text x="225" y="475" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#FDFDFF" text-anchor="middle" letter-spacing="-0.02em">Tetangga Suuzon</text>
  <text x="225" y="505" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#F42902" text-anchor="middle" letter-spacing="0.5">VIBE AI COMMERCIAL</text>
  <text x="225" y="530" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#71717A" text-anchor="middle">Instagram Reel Performance Creative</text>
  
  <!-- Bottom Accent -->
  <rect x="185" y="750" width="80" height="2" fill="#F42902" rx="1"/>
</svg>

